name: Build and Publish Docker Image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'  # Release tags only, e.g. v0.2.0 or v0.3.0-rc1
  workflow_dispatch:

# A second push to the same ref supersedes the first, so the earlier run should
# stop rather than burn a runner to completion. Tag runs are never cancelled:
# they publish, and losing one halfway would leave a partly pushed release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Without this a hung job runs for GitHub's six-hour default.
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      # Installed from a pinned release asset with a checksum rather than by
      # piping actionlint's install script into bash. That script is fetched
      # from a branch we do not control and resolves `latest` at run time, so
      # a compromise upstream would run arbitrary code in this job — which
      # runs on `pull_request`. Dependabot does not track this pin: bump
      # ACTIONLINT_VERSION and ACTIONLINT_SHA256 together by hand, taking the
      # hash from the actionlint_<version>_checksums.txt published with the
      # release.
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -sSfL -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

      # actionlint runs shellcheck over `run:` blocks in workflows only. The
      # shell under test-env/ drives a VM and is not covered by anything else,
      # so it is linted explicitly here. shellcheck is preinstalled on GitHub
      # runners; a plain dev box usually needs it installed.
      - name: Lint shell scripts
        run: shellcheck -x test-env/*.sh test-env/lib/*.sh

      - name: Compile Python files
        run: python -m py_compile main.py pfsense.py

      - name: Lint
        run: python -m pylint main.py pfsense.py

      - name: Audit dependencies for known vulnerabilities
        run: |
          python -m pip_audit -r requirements.txt --strict
          python -m pip_audit -r requirements-dev.txt --strict

      # Coverage threshold lives in .coveragerc (fail_under). Tests passing is
      # not sufficient — the step fails if coverage drops below it.
      - name: Run tests with coverage gate
        run: python -m pytest --cov --cov-report=term-missing

      - name: Build Docker image
        run: docker build -t pfsense-docker-alias .

      # pip-audit checks only the pinned requirements files. Everything else in
      # the image -- the Alpine layer, and whatever the base image ships -- is
      # invisible to it, and that gap was real: this step found two HIGH
      # findings the first time it ran, both from pip's vendored dependency
      # manifest. The Dockerfile now removes pip after installing, so neither
      # the installer nor its manifest is in the runtime image.
      #
      # ignore-unfixed is deliberate. A CVE with no available fix would block
      # every PR with nothing the author could do about it, which is how a gate
      # trains people to ignore CI. A *fixable* HIGH means bump the base image,
      # which Dependabot already proposes weekly, so that one should block.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pfsense-docker-alias
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Guards what `docker build` cannot: that the image's Python entrypoint
      # actually runs. A new runtime module missing its Dockerfile COPY builds
      # fine and fails only at import time.
      - name: Smoke test image rejects missing configuration
        run: |
          set +e
          output=$(docker run --rm pfsense-docker-alias 2>&1)
          status=$?
          set -e
          echo "${output}"
          if [ "${status}" -ne 1 ]; then
            echo "::error::expected exit 1 without env vars, got ${status}"
            exit 1
          fi
          echo "${output}" | grep -q "PFSENSE_HOSTNAME" \
            || { echo "::error::missing expected config error"; exit 1; }

      - name: Smoke test image starts and listens for events
        run: |
          docker run -d --name smoke \
            -e PFSENSE_HOSTNAME=pfsense.invalid -e PFSENSE_API_TOKEN=dummy \
            -v /var/run/docker.sock:/var/run/docker.sock pfsense-docker-alias
          for _ in $(seq 1 30); do
            docker logs smoke 2>&1 | grep -q "Listening for container start/stop events" && break
            sleep 1
          done
          docker logs smoke
          docker logs smoke 2>&1 | grep -q "Listening for container start/stop events" \
            || { echo "::error::container never reached its event loop"; exit 1; }
          [ "$(docker inspect -f '{{.State.Status}}' smoke)" = "running" ] \
            || { echo "::error::container did not stay running"; exit 1; }
          docker rm -f smoke

      # Hand the publish job the exact image these smoke tests just ran. The
      # publish job used to rebuild from scratch, so the artifact users pulled
      # was never the one anything had executed.
      - name: Save tested image
        if: startsWith(github.ref, 'refs/tags/')
        run: docker save pfsense-docker-alias -o "${RUNNER_TEMP}/image.tar"

      - name: Upload tested image
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: tested-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  build-and-push:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      # No checkout and no build: this job publishes the artifact the test job
      # produced, and must not construct an image of its own.
      - name: Download tested image
        uses: actions/download-artifact@v8
        with:
          name: tested-image
          path: ${{ runner.temp }}

      - name: Load tested image
        run: docker load -i "${RUNNER_TEMP}/image.tar"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest moves only for a plain vX.Y.Z tag. A pre-release such as
      # v0.3.0-rc1 publishes under its own tag and leaves :latest alone, so
      # nobody tracking :latest is upgraded onto a release candidate. The old
      # trigger matched every tag and moved :latest for all of them.
      - name: Push tested image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          docker tag pfsense-docker-alias "${IMAGE}:${tag}"
          docker push "${IMAGE}:${tag}"
          if printf '%s' "${tag}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag ${tag}: moving :latest"
            docker tag pfsense-docker-alias "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          else
            echo "Tag ${tag} is not a plain vX.Y.Z release: leaving :latest unchanged"
          fi
